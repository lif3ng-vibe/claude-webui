name: build-desktop

# 暂禁用 tag 自动触发（GitHub runner 排不到）；需要时手动 workflow_dispatch 触发（产物作为 artifact 下载）。
# windows x64、mac arm64+x64 都跑在 macos-latest（mac x64 交叉编译，避开 Intel runner macos-13 排队）。
# 用 per-arch 而非 universal：node-pty 是原生模块，per-arch runner 的 npm ci 自动拿本机 arch 预编译，无需跨 arch 抓取。
# 全部未签名（无证书）：mac 首次打开需右键 → 打开（Gatekeeper 警告），Win 弹 SmartScreen。
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  electron:
    name: electron / ${{ matrix.os }} / ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
          - os: macos-latest
            arch: arm64
          - os: macos-latest
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm --prefix web ci
      - run: npm run dist:electron
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_ARCH: ${{ matrix.arch }}
          # macOS未签名：不设 CSC_LINK/CSC_KEY_PASSWORD，产出未签名 dmg。
      - name: 列出产物（诊断）
        if: always()
        shell: bash
        run: |
          echo "## Electron 产物 (release/)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          find release -type f 2>/dev/null | sed 's/^/  /' >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: upload (windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: electron-Windows-${{ matrix.arch }}
          path: release/*.exe
          if-no-files-found: error
      - name: upload (mac)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: electron-macOS-${{ matrix.arch }}
          path: |
            release/*.dmg
            release/*-mac.zip
          if-no-files-found: error

  tauri:
    name: tauri / ${{ matrix.os }} / ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
            tauri_target: ""
          - os: macos-latest
            arch: arm64
            tauri_target: aarch64-apple-darwin
          - os: macos-latest
            arch: x64
            tauri_target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - uses: dtolnay/rust-toolchain@stable
      - name: 安装 rust target（mac）
        if: matrix.tauri_target != ''
        run: rustup target add ${{ matrix.tauri_target }}
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm --prefix web ci
      - name: tauri build
        shell: bash
        run: |
          if [ -n "${{ matrix.tauri_target }}" ]; then
            npx tauri build --target ${{ matrix.tauri_target }} --verbose
          else
            npx tauri build --verbose
          fi
      - name: 列出产物（诊断）
        if: always()
        shell: bash
        run: |
          echo "## Tauri 产物 (bundle/)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          find src-tauri/target -path '*bundle*' -type f 2>/dev/null | sed 's/^/  /' >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: upload (windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: tauri-Windows-${{ matrix.arch }}
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
      - name: upload (mac)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: tauri-macOS-${{ matrix.arch }}
          path: src-tauri/target/${{ matrix.tauri_target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error

  release:
    name: 发布 Release（仅 tag 触发）
    needs: [electron, tauri]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.exe
            artifacts/**/*.msi
          fail_on_unmatched_files: true
          generate_release_notes: true